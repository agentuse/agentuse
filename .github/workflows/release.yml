# Publish agentuse to npm.
#
# The filename is load-bearing: npm binds a package's trusted publisher to one
# exact owner / repo / workflow filename / environment. Renaming this file breaks
# publishing until the binding is edited on npmjs.com.
#
# The approval gate is not a speed bump in front of a credential, it is the
# credential's precondition. `environment: release` is part of that binding, so
# the OIDC token that authorizes a publish cannot be minted until a required
# reviewer approves. A stray tag push, from anyone, reaches `verify` and stops.
name: release

on:
  push:
    tags: ['v*']
  # Manual runs exercise the gate and the brief and cannot publish: the publish
  # job requires a tag push. This is the permanent dry run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # agentuse-lab mirrors this repo commit for commit and has Actions enabled, so
  # without this guard a tag pushed there starts a second run on billed private
  # minutes that can only ever end in a failed publish. There is no workflow-level
  # `if`, so every job carries it.
  #
  # RELEASE_REHEARSAL is the deliberate exception: set it as a repository variable
  # on agentuse-lab to run the gate there on real GitHub hardware without pushing
  # anything public. It cannot unlock publishing, which stays pinned to the repo
  # name below. A variable rather than an edit-and-revert, because a temporary
  # loosening of a guard is exactly the kind of thing that stops being temporary.
  verify:
    if: github.repository == 'agentuse/agentuse' || vars.RELEASE_REHEARSAL == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history and tags: the brief reports commits since the last tag.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Gate
        run: bun scripts/release.ts verify

      - name: Release review brief
        # Runs even when the gate fails, so a red run still says where it broke.
        if: always()
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            bun scripts/release-brief.ts "${GITHUB_REF_NAME#v}"
          else
            bun scripts/release-brief.ts
          fi

  # Build each release on its native architecture. A tag build signs and
  # notarizes the final artifacts; a manual rehearsal remains credential-free
  # and exercises the same architecture-specific package assembly.
  desktop:
    if: github.repository == 'agentuse/agentuse' || vars.RELEASE_REHEARSAL == 'true'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            helper_arch: arm64
          - arch: x64
            runner: macos-15-intel
            helper_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup

      - name: Desktop package gate
        if: github.repository != 'agentuse/agentuse' || github.event_name != 'push'
        run: bun scripts/release.ts verify-desktop

      - name: Require signing credentials
        if: github.repository == 'agentuse/agentuse' && github.event_name == 'push'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required Actions secret: $name"
              exit 1
            fi
          done

      - name: Build, sign, and notarize ${{ matrix.arch }}
        if: github.repository == 'agentuse/agentuse' && github.event_name == 'push'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AGENTUSE_SKIP_SERVE_RESTART: '1'
        run: |
          pnpm run build
          pnpm --filter @agentuse/desktop run build
          pnpm --filter @agentuse/desktop exec electron-builder \
            --mac \
            --${{ matrix.arch }} \
            --publish never \
            -c.forceCodeSigning=true

      - name: Verify ${{ matrix.arch }} signature and notarization
        if: github.repository == 'agentuse/agentuse' && github.event_name == 'push'
        shell: bash
        run: |
          APP_PATH="$(find apps/desktop/dist -type d -name AgentUse.app -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "AgentUse.app was not produced"
            exit 1
          fi

          EXECUTABLE="$APP_PATH/Contents/MacOS/AgentUse"
          SETTINGS="$APP_PATH/Contents/Frameworks/AgentUseSettings.app/Contents/MacOS/AgentUseSettings"
          for binary in "$EXECUTABLE" "$SETTINGS"; do
            if ! lipo -archs "$binary" | tr ' ' '\n' | grep -Fxq '${{ matrix.helper_arch }}'; then
              echo "$binary does not contain ${{ matrix.helper_arch }}"
              lipo -archs "$binary"
              exit 1
            fi
          done

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --verbose=2 --type execute "$APP_PATH"

      - name: Preserve ${{ matrix.arch }} release artifacts
        if: github.repository == 'agentuse/agentuse' && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml

  # Functional dashboard smoke through the real daemon and a loopback model.
  # The browser only verifies that the built bundle loads without runtime errors.
  e2e:
    if: github.repository == 'agentuse/agentuse' || vars.RELEASE_REHEARSAL == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: npm install -g agent-browser
      - run: bun run test:e2e

  # No rehearsal escape hatch here, on purpose. Publishing happens from the public
  # repo or not at all: that is what npm's trusted publisher is bound to, and
  # release.ts refuses to publish when package.json's repository disagrees with
  # the repo it is running in.
  publish:
    if: github.repository == 'agentuse/agentuse' && github.event_name == 'push'
    needs: [verify, desktop, e2e]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # mint the OIDC token npm exchanges for a publish grant
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Download architecture-specific macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: macos-*
          path: tmp/macos-artifacts

      - name: Merge macOS updater metadata
        shell: bash
        run: |
          mkdir -p tmp/macos-release
          find tmp/macos-artifacts -type f ! -name latest-mac.yml -exec cp {} tmp/macos-release/ \;
          bun scripts/merge-mac-update-metadata.ts \
            tmp/macos-artifacts/macos-arm64/latest-mac.yml \
            tmp/macos-artifacts/macos-x64/latest-mac.yml \
            tmp/macos-release/latest-mac.yml

      # Trusted publishing needs npm >= 11.5.1; keep the privileged job on the
      # minimum audited version instead of executing a mutable `latest` release.
      - run: npm install -g npm@11.5.1

      # `prepack` builds, so publish ships a build of the approved commit.
      - run: bun scripts/release.ts publish

      - run: bun scripts/release.ts finish
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload macOS release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" tmp/macos-release/* --clobber
