<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose where to work</title>
<style>
:root{--ink:#0f172a;--muted:#475569;--line:#e5e7eb;--card:#ffffff;--soft:#f8fafc;--signal:#00dc82;--signal-ink:#0f172a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f8fafc;--muted:#94a3b8;--line:#1e293b;--card:#0b1220;--soft:#111827}}
:root[data-theme="dark"]{--ink:#f8fafc;--muted:#94a3b8;--line:#1e293b;--card:#0b1220;--soft:#111827}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:16px;font-weight:700}
p{margin:0;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
label{font-weight:600}
select,button{font:inherit;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
select{width:100%;padding:6px 10px;text-overflow:ellipsis}
button{cursor:pointer}
button.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:700}
button:disabled,select:disabled{opacity:.6;cursor:default}
button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.status{min-height:1.2em;overflow-wrap:anywhere}
.selection{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;background:var(--soft);border-radius:8px;padding:10px 12px}
.selection dt{color:var(--muted)}
.selection dd{margin:0;overflow-wrap:anywhere}
@media(max-width:420px){.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="card" aria-label="AgentUse destination"><p class="status" role="status">Loading connected computers…</p></section>
<script>/*__CARD_SCRIPT__*/</script>
</body>
</html>
